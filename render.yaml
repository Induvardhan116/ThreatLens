services:
  - type: web
    name: threatlens-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: THREATLENS_DATA_DIR
        value: ./data
      - key: THREATLENS_CORS_ORIGINS
        sync: false
